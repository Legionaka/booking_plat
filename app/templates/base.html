{% from "components/toast.html" import toast %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block page_title %}Booking Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/typography.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/system.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/components/toast.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/components/auth-controls.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/components/surfaces.js') }}" defer></script>
  </head>
  <body>
    {{ toast() }}
    <main class="page-shell {% block page_shell_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    {% block page_scripts %}{% endblock %}
  </body>
</html>
