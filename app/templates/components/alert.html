{% macro alert(tone='info', title='', message='', mark='i') -%}
<div class="alert alert--{{ tone }}" role="{{ 'alert' if tone == 'error' else 'status' }}" aria-live="polite" data-alert hidden><span class="alert__mark" aria-hidden="true">{{ mark }}</span><div class="alert__copy">{% if title %}<strong>{{ title }}</strong>{% endif %}<span data-alert-message>{{ message }}</span></div></div>
{%- endmacro %}
