{% macro text_input(field_id, label, name, type='text', autocomplete='off', required=true, disabled=false, error='', help='', placeholder='', minlength=None, maxlength=None) -%}
<div class="field" data-field>
  <label class="field__label" for="{{ field_id }}">{{ label }}</label>
  <input class="field__control" id="{{ field_id }}" name="{{ name }}" type="{{ type }}" autocomplete="{{ autocomplete }}" {% if required %}required{% endif %} {% if disabled %}disabled{% endif %} {% if error %}aria-invalid="true"{% endif %} aria-describedby="{{ field_id }}-help {{ field_id }}-error" {% if placeholder %}placeholder="{{ placeholder }}"{% endif %} {% if minlength is not none %}minlength="{{ minlength }}"{% endif %} {% if maxlength is not none %}maxlength="{{ maxlength }}"{% endif %}>
  <p class="field__help" id="{{ field_id }}-help">{{ help }}</p><p class="field__error" id="{{ field_id }}-error" aria-live="polite">{{ error }}</p>
</div>
{%- endmacro %}
