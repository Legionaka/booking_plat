<div class="field" data-field data-password-field>
  <label class="field__label" for="{{ field_id }}">{{ label|default('Password') }}</label>
  <div class="password-control"><input class="field__control" id="{{ field_id }}" name="{{ name|default('password') }}" type="password" autocomplete="{{ autocomplete|default('current-password') }}" required minlength="10" maxlength="128" {% if disabled|default(false) %}disabled{% endif %} {% if error|default('') %}aria-invalid="true"{% endif %} aria-describedby="{{ field_id }}-help {{ field_id }}-error {{ field_id }}-caps"><button class="password-toggle button button--secondary" type="button" aria-label="Show password" aria-pressed="false" {% if disabled|default(false) %}disabled{% endif %}>Show</button></div>
  <p class="field__help" id="{{ field_id }}-help">{{ help|default('At least 10 characters.') }}</p><p class="field__error" id="{{ field_id }}-error" aria-live="polite">{{ error|default('') }}</p><p class="field__caps" id="{{ field_id }}-caps" aria-live="polite" hidden>Caps Lock is on.</p>
  {% if meter|default(false) %}<div class="strength" data-strength aria-live="polite"><div class="strength__track" aria-hidden="true"><span class="strength__fill"></span></div><p class="strength__label">Password strength: <span data-strength-label>Not entered</span></p></div>{% endif %}
</div>
