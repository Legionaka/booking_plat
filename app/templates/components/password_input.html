{% macro password_input(field_id, label='Password', name='password', autocomplete='current-password', help='At least 10 characters.', disabled=false, error='', meter=false) -%}
<div class="field" data-field data-password-field>
  <label class="field__label" for="{{ field_id }}">{{ label }}</label>
  <div class="password-control"><input class="field__control" id="{{ field_id }}" name="{{ name }}" type="password" autocomplete="{{ autocomplete }}" required minlength="10" maxlength="128" {% if disabled %}disabled{% endif %} {% if error %}aria-invalid="true"{% endif %} aria-describedby="{{ field_id }}-help {{ field_id }}-error {{ field_id }}-caps"><button class="password-toggle button button--secondary" type="button" aria-label="Show password" aria-pressed="false" {% if disabled %}disabled{% endif %}>Show</button></div>
  <p class="field__help" id="{{ field_id }}-help">{{ help }}</p><p class="field__error" id="{{ field_id }}-error" aria-live="polite">{{ error }}</p><p class="field__caps" id="{{ field_id }}-caps" aria-live="polite" hidden>Caps Lock is on.</p>
  {% if meter %}<div class="strength" data-strength aria-live="polite"><div class="strength__track" aria-hidden="true"><span class="strength__fill"></span></div><p class="strength__label">Password strength: <span data-strength-label>Not entered</span></p></div>{% endif %}
</div>
{%- endmacro %}
