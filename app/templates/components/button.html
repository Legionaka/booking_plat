{% from "components/spinner.html" import spinner %}
{% macro button(label, type='button', primary=false, disabled=false, busy=false) -%}
<button class="button {{ 'button--primary' if primary else 'button--secondary' }}" type="{{ type }}" {% if disabled %}disabled{% endif %} {% if busy %}aria-busy="true"{% endif %}><span class="button__label">{{ label }}</span>{{ spinner() }}</button>
{%- endmacro %}
