services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking_platform}
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking_dev_only}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-databases.sql:/docker-entrypoint-initdb.d/01-test-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      FLASK_APP: app:create_app
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-local-development-only}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking_dev_only}@db:5432/${POSTGRES_DB:-booking_platform}
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/1
      RATELIMIT_KEY_PREFIX: ${RATELIMIT_KEY_PREFIX:-booking-platform:}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      WEB_WORKERS: ${WEB_WORKERS:-3}
      MIGRATE_ON_STARTUP: ${MIGRATE_ON_STARTUP:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      PORT: 5000
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      SERVER_SESSION_TTL_SECONDS: ${SERVER_SESSION_TTL_SECONDS:-86400}
      AUTH_REGISTER_RATE_LIMIT: ${AUTH_REGISTER_RATE_LIMIT:-20 per hour}
      AUTH_LOGIN_EMAIL_RATE_LIMIT: ${AUTH_LOGIN_EMAIL_RATE_LIMIT:-5 per minute}
      AUTH_LOGIN_IP_RATE_LIMIT: ${AUTH_LOGIN_IP_RATE_LIMIT:-30 per hour}
      AUTH_FORGOT_EMAIL_RATE_LIMIT: ${AUTH_FORGOT_EMAIL_RATE_LIMIT:-5 per hour}
      AUTH_FORGOT_IP_RATE_LIMIT: ${AUTH_FORGOT_IP_RATE_LIMIT:-30 per hour}
      AUTH_RESET_TOKEN_RATE_LIMIT: ${AUTH_RESET_TOKEN_RATE_LIMIT:-5 per hour}
      AUTH_RESET_IP_RATE_LIMIT: ${AUTH_RESET_IP_RATE_LIMIT:-30 per hour}
      AVAILABILITY_MINIMUM_NOTICE_MINUTES: ${AVAILABILITY_MINIMUM_NOTICE_MINUTES:-120}
      AVAILABILITY_MAXIMUM_ADVANCE_DAYS: ${AVAILABILITY_MAXIMUM_ADVANCE_DAYS:-60}
      PUBLIC_AVAILABILITY_RATE_LIMIT: ${PUBLIC_AVAILABILITY_RATE_LIMIT:-60 per minute}
      HOLD_MINUTES: ${HOLD_MINUTES:-15}
      MAX_PENDING_HOLDS_PER_USER: ${MAX_PENDING_HOLDS_PER_USER:-3}
      BOOKING_CREATE_RATE_LIMIT: ${BOOKING_CREATE_RATE_LIMIT:-10 per minute}
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-default}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-100}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      NOTIFICATION_IN_PROGRESS_TIMEOUT_SECONDS: ${NOTIFICATION_IN_PROGRESS_TIMEOUT_SECONDS:-300}
      NOTIFICATION_RETRY_INTERVALS_SECONDS: ${NOTIFICATION_RETRY_INTERVALS_SECONDS:-60,300,900,900}
      BOOKING_MANAGE_BASE_URL: ${BOOKING_MANAGE_BASE_URL:-http://localhost:5000}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID:-}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY:-}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE:-}
      PAYFAST_SANDBOX: ${PAYFAST_SANDBOX:-true}
      PAYFAST_ITN_RATE_LIMIT: ${PAYFAST_ITN_RATE_LIMIT:-600 per minute}
      PAYFAST_VALIDATE_TIMEOUT_SECONDS: ${PAYFAST_VALIDATE_TIMEOUT_SECONDS:-8}
      PAYMENT_HOLD_MINUTES: ${PAYMENT_HOLD_MINUTES:-20}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5000}
      DEMO_OWNER_EMAIL: ${DEMO_OWNER_EMAIL:-owner@fade-lab.demo}
      DEMO_OWNER_PASSWORD: ${DEMO_OWNER_PASSWORD:-DemoOnly-ChangeMe-2026!}
      DEMO_OWNER_NAME: ${DEMO_OWNER_NAME:-Fade Lab Owner}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.web_startup"]

  worker:
    build: .
    environment: &job_environment
      FLASK_APP: app:create_app
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-local-development-only}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking_dev_only}@db:5432/${POSTGRES_DB:-booking_platform}
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/1
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-default}
      NOTIFICATION_RETRY_INTERVALS_SECONDS: ${NOTIFICATION_RETRY_INTERVALS_SECONDS:-60,300,900,900}
      BOOKING_MANAGE_BASE_URL: ${BOOKING_MANAGE_BASE_URL:-http://localhost:5000}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID:-}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY:-}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE:-}
      PAYFAST_SANDBOX: ${PAYFAST_SANDBOX:-true}
      PAYFAST_VALIDATE_TIMEOUT_SECONDS: ${PAYFAST_VALIDATE_TIMEOUT_SECONDS:-8}
      PAYMENT_HOLD_MINUTES: ${PAYMENT_HOLD_MINUTES:-20}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5000}
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["flask", "--app", "app:create_app", "worker", "run"]

  scheduler:
    build: .
    environment:
      <<: *job_environment
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-100}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      NOTIFICATION_IN_PROGRESS_TIMEOUT_SECONDS: ${NOTIFICATION_IN_PROGRESS_TIMEOUT_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["flask", "--app", "app:create_app", "scheduler", "run"]

volumes:
  postgres_data:

